[package]
name = "commit-canvas"
version = "1.0.0"
description = "Draw on your GitHub contribution graph"
authors = ["Cedric"]
license = "AGPL-3.0-only"
repository = "https://github.com/ced2711/commit-canvas"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
